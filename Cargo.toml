[package]
name = "foldhash"
version = "0.2.0"
authors = ["Orson Peters <orsonpeters@gmail.com>"]
license = "Zlib"
repository = "https://github.com/orlp/foldhash"
readme = "README.md"
keywords = ["hash", "hasher", "no-std"]
categories = ["algorithms", "no-std"]
description = "A fast, non-cryptographic, minimally DoS-resistant hashing algorithm."
edition = "2021"
exclude = ["benches", "tools", "assets"]
rust-version = "1.60"

[features]
default = ["std"]
std = []
nightly = []
# Enables `secure::RandomState`, which draws a per-instance 128-bit key from the
# OS CSPRNG. Pulls in `getrandom`; the `secure` variant's core, `FixedState`, and
# `with_key` remain available (zero-dep) without this feature.
secure = ["dep:getrandom"]

[dependencies]
getrandom = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"
hashbrown = "0.15"
uuid = "1.8"
rand = "0.8"
ahash = "0.8"
fxhash = "0.2"
rapidhash = "3.1.0"
chrono = "0.4"

[lib]
bench = false

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[[bench]]
name = "avalanche"
path = "benches/avalanche.rs"
harness = false

[profile.release]
lto = "thin"
